    <script>
      // Net lobby guard: the build's net client reconnects forever, reusing the same room token, so a down service (502) or
      // an expired room (410) fills the console and the network with failed handshakes. Allow a few failed attempts to
      // the net endpoint, then hand back a socket that closes quietly without touching the network. Games don't depend on it.
      (function () {
        var Native = window.WebSocket, MAX_FAILS = 2, fails = 0;
        if (!Native) return;
        function isNet(u) {
          try { return new URL(String(u), location.href).host === new URL(window.HAWKES_NET_ENDPOINT).host; } catch (e) { return false; }
        }
        function Guarded(url, protocols) {
          if (!isNet(url)) return protocols === undefined ? new Native(url) : new Native(url, protocols);
          if (fails >= MAX_FAILS) {
            var stub = new EventTarget();
            stub.readyState = 3; stub.url = String(url); stub.protocol = ''; stub.extensions = ''; stub.bufferedAmount = 0;
            stub.binaryType = 'blob'; stub.send = function () {}; stub.close = function () {};
            setTimeout(function () {
              var ev = new Event('close'); ev.code = 1006; ev.wasClean = false; ev.reason = '';
              if (typeof stub.onerror === 'function') stub.onerror(new Event('error'));
              stub.dispatchEvent(new Event('error'));
              if (typeof stub.onclose === 'function') stub.onclose(ev);
              stub.dispatchEvent(ev);
            }, 0);
            return stub;
          }
          var ws = protocols === undefined ? new Native(url) : new Native(url, protocols);
          var opened = false;
          ws.addEventListener('open', function () { opened = true; fails = 0; });
          ws.addEventListener('close', function () { if (!opened) fails++; });
          return ws;
        }
        Guarded.prototype = Native.prototype;
        ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) { Guarded[k] = Native[k]; });
        window.WebSocket = Guarded;
      })();
    </script>

    <script>
      // Console log capture system
      var consoleLogs = [];
      var originalConsole = {
        log: console.log,
        warn: console.warn,
        error: console.error,
        info: console.info
      };

      function captureLog(type, args) {
        var timestamp = new Date().toISOString();
        var message = Array.from(args).map(function(arg) {
          if (typeof arg === 'object') {
            try { return JSON.stringify(arg); }
            catch(e) { return String(arg); }
          }
          return String(arg);
        }).join(' ');
        consoleLogs.push('[' + timestamp + '] [' + type.toUpperCase() + '] ' + message);
      }

      console.log = function() {
        captureLog('log', arguments);
        originalConsole.log.apply(console, arguments);
      };
      console.warn = function() {
        captureLog('warn', arguments);
        originalConsole.warn.apply(console, arguments);
      };
      console.error = function() {
        captureLog('error', arguments);
        originalConsole.error.apply(console, arguments);
      };
      console.info = function() {
        captureLog('info', arguments);
        originalConsole.info.apply(console, arguments);
      };

      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      
      // Enhanced mobile detection that includes iPads with iPadOS 13+
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || // iPad with iPadOS 13+
                     ('ontouchstart' in window); // Any touch-capable device
      
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPad with iPadOS 13+

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        if (type == 'warning') div.className = 'warning';
        warningBanner.appendChild(div);
        if (type == 'error') {
          div.style = 'background: rgba(255, 0, 0, 0.9); padding: 10px;';
        } else {
          if (type == 'warning') div.style = 'background: rgba(255, 193, 7, 0.9); color: #000; padding: 10px;';
          setTimeout(function() {
            if (warningBanner.contains(div)) {
              warningBanner.removeChild(div);
            }
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var gameName = "SickOfIt";
      var gameVersion = "v272"; // Update this when you publish a new game build

      // Safari deletes IndexedDB and the Cache API (Unity's bundle cache) after
      // 7 days of browser use with no visit. persist() opts this origin out of
      // that eviction. It has to follow a user gesture, and Safari grants it
      // from site use, especially once the game is installed to the Home Screen.
      function requestPersistentStorage() {
        if (!navigator.storage || !navigator.storage.persist)
          return;
        navigator.storage.persist().then(function (granted) {
          console.log("[Storage] persistent:", granted);
        });
      }
      window.addEventListener("pointerdown", function () {
        requestPersistentStorage();
      }, { once: true });
      
      // Update version display
      var versionDisplay = document.getElementById('version-display');
      versionDisplay.textContent = gameVersion;
      // The release (releases.json, written at each go live) and the build running: "v1.0.0 · build 106".
      if (window.hawkesRelease) window.hawkesRelease.then(function (r) {
        var top = r && r.releases && r.releases[0];
        if (!top) return;
        var beta = /\.hawkesgen\.ai$/.test(location.hostname) || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        versionDisplay.textContent = 'v' + top.version + (beta ? ' beta' : '') + ' \u00b7 build ' + gameVersion.replace(/^v/, '');
        versionDisplay.title = 'What\'s new: ' + new URL('../whatsnew.html', location.href).href + ' (click copies the console log)';
      });
      
      // Add click handler to copy console logs to clipboard
      versionDisplay.addEventListener('click', function() {
        if (consoleLogs.length === 0) {
          alert('No console logs to copy!');
          return;
        }
        
        var logText = consoleLogs.join('\n');
        
        // Try to copy to clipboard
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(logText).then(function() {
            var originalText = versionDisplay.textContent;
            versionDisplay.textContent = 'Copied!';
            setTimeout(function() {
              versionDisplay.textContent = originalText;
            }, 1000);
          }).catch(function(err) {
            console.error('Failed to copy logs:', err);
            alert('Failed to copy logs to clipboard');
          });
        } else {
          // Fallback for older browsers
          var textarea = document.createElement('textarea');
          textarea.value = logText;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            var originalText = versionDisplay.textContent;
            versionDisplay.textContent = 'Copied!';
            setTimeout(function() {
              versionDisplay.textContent = originalText;
            }, 1000);
          } catch (err) {
            console.error('Failed to copy logs:', err);
            alert('Failed to copy logs to clipboard');
          }
          document.body.removeChild(textarea);
        }
      });
      
      var buildUrl = "https://sites.hawkesgen.ai/builds/sickofit/v272/" + gameName + "/Build/" + gameName;
      var loaderUrl = buildUrl + ".loader.js?v=" + gameVersion; // Add version query param
      var config = {
        arguments: [],
        dataUrl: buildUrl + ".data.unityweb?v=" + gameVersion,
        frameworkUrl: buildUrl + ".framework.js.unityweb?v=" + gameVersion,
        codeUrl: buildUrl + ".wasm.unityweb?v=" + gameVersion,
        streamingAssetsUrl: "https://sites.hawkesgen.ai/builds/sickofit/v272/" + gameName + "/StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Sick Of It",
        // Unity deletes every cached bundle when productVersion changes.
        // Bundle filenames already include a content hash, so this stays on
        // the current publish tag and is split so the deploy find-replace
        // (which rewrites the literal game version) cannot bump it.
        productVersion: ["v", "101"].join(""),
        // Hashed .bundle URLs never change in place. "immutable" serves them
        // from Unity's browser cache with no revalidation request.
        // The player .data file keeps must-revalidate; its ?v= query changes
        // on each publish. Everything else stays out of Unity's cache.
        cacheControl: function (url) {
          if (url.indexOf(".bundle") !== -1)

          if (url.indexOf(".data") !== -1)
            return "must-revalidate";
          return "no-store";

      if (isMobile) {
        document.addEventListener('touchmove', function(e) {

        document.body.addEventListener('touchstart', function(e) {

      // Only the CSS size is set here: Unity sizes the drawing buffer itself. Resizing canvas.width/height
      // from the page (and swapping the viewport meta) broke the GL context after a few rotations.
      var resizeTimer = null;
      function resizeCanvas() {
        var width = window.innerWidth;
        var height = window.innerHeight;

        if (isMobile && window.visualViewport) {
          width = window.visualViewport.width;
          height = window.visualViewport.height;
        }

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }

      // Rotation fires several resize events while the browser settles: size once, after it has.
      function scheduleResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          window.scrollTo(0, 0);
          resizeCanvas();
        }, 150);
      }

      window.addEventListener('resize', scheduleResize);
      window.addEventListener('orientationchange', scheduleResize);
      if (isMobile && window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleResize);
      }

      resizeCanvas();

      async function lockOrientationToLandscape() {
        if (!isMobile) return;
        
        try {
          // Try to lock to landscape (works in fullscreen on supported browsers)
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
            console.log('Orientation locked to landscape');
          }
        } catch (error) {
          console.log('Orientation lock not supported or requires fullscreen:', error.message);
        }
      }
      
      // Playtest setup shortcut: ?playtest=fail-load (or game-fail) behaves as if the build could not be fetched.
      // Only active when a playtest query is present — players never see this path.
      var forceFail = /[?&]playtest=(fail-load|game-fail)\b/.test(location.search);

      // Load Unity game immediately (user is already authenticated)
      var loadAttempt = 0, stallTimer = null, failed = false;
      function loadFailed(line) {
        if (failed) return;
        failed = true;
        clearTimeout(stallTimer);
        window.dispatchEvent(new CustomEvent("hawkes-unity-fail", { detail: line }));
      }
      function armStall() {
        clearTimeout(stallTimer);
        var at = loadAttempt;
        stallTimer = setTimeout(function() { if (at === loadAttempt) loadFailed("Hell is taking too long to answer."); }, 45000);
      }
      function webglOk() {
        try { var c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { return false; }
      }
      function retryLoad() {
        loadAttempt++; failed = false; forceFail = false;
        var old = document.getElementById("unity-loader-script");
        if (old) old.remove();
        document.querySelector("#unity-warning").innerHTML = "";
        document.querySelector("#unity-warning").style.display = "none";
        window.dispatchEvent(new Event("hawkes-unity-retry"));
        startGame();
      }
      window.hawkesRetryLoad = retryLoad;
      function loadUnityGame() {
        var at = ++loadAttempt;
        if (!webglOk()) { loadFailed("This browser can't run WebGL. Try another one."); return; }
        armStall();
        var script = document.createElement("script");
        script.id = "unity-loader-script";
        script.src = forceFail ? (window.HAWKES_BUILD_BASE || "").replace(/\/?$/, "/") + "loadfail-missing.js" : loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            if (at !== loadAttempt || failed) return;
            armStall();
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            window.dispatchEvent(new CustomEvent("hawkes-unity-progress", { detail: progress }));
          }).then(function(unityInstance) {
            if (at !== loadAttempt || failed) return;
            clearTimeout(stallTimer);
            document.querySelector("#unity-loading-bar").style.display = "none";
            window.unityInstance = unityInstance;
            window.dispatchEvent(new Event("hawkes-unity-ready"));
            
            function tryFullscreen() {
              if (isIOS) {
                console.log('iOS detected - skipping fullscreen request (not fully supported)');
                return;
              }

              var elem = container;
              if (elem.requestFullscreen) {
                elem.requestFullscreen().then(function() {
                  // Try to lock orientation when entering fullscreen (most reliable)
                  lockOrientationToLandscape();
                }).catch(function(err) {
                  console.log("Fullscreen request failed:", err);
                });
              } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
                // Webkit doesn't return a promise, so try locking after a short delay
                setTimeout(lockOrientationToLandscape, 100);
              } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
                setTimeout(lockOrientationToLandscape, 100);
              }
            }

            if (!isIOS) {
              tryFullscreen();
            }

            var canvasElement = canvas;
            var needsPointerLockReacquire = false;

            document.addEventListener('pointerlockchange', function() {
              if (document.pointerLockElement !== canvasElement) {
                needsPointerLockReacquire = true;
              } else {
                needsPointerLockReacquire = false;
              }
            });

            function reacquirePointerLock() {
              if (needsPointerLockReacquire && document.pointerLockElement !== canvasElement) {
                canvasElement.requestPointerLock = canvasElement.requestPointerLock ||
                                                    canvasElement.mozRequestPointerLock ||
                                                    canvasElement.webkitRequestPointerLock;
                if (canvasElement.requestPointerLock) {
                  canvasElement.requestPointerLock();
                }
              }
            }

            if (!isMobile) {
              canvasElement.addEventListener('mousedown', reacquirePointerLock);
              canvasElement.addEventListener('click', reacquirePointerLock);
            } else {
              canvasElement.addEventListener('touchstart', function(e) {
                // Mobile touch handling
              }, { passive: false });
            }

          }).catch(function(message) {
            if (at !== loadAttempt) return;
            unityShowBanner(message, 'error');
            loadFailed("The game hit a snag while loading.");
          });
        };

        script.onerror = function() {
          if (at !== loadAttempt) return;
          unityShowBanner("Failed to load Unity game. Please check your connection and try again.", 'error');
          loadFailed("Couldn't reach the game. Check your connection.");
        };

        document.body.appendChild(script);
      }

      // build.json (written by every Hawkes Gen publish) names the build this page should play. Read it first so the
      // page never plays an older build than the one published; if it can't be read, play the version baked in above.
      function useBuild(base, version) {
        base = base.replace(/\/?$/, "/");
        gameVersion = version;
        window.HAWKES_BUILD = { version: version };
        versionDisplay.textContent = gameVersion;
        buildUrl = base + gameName + "/Build/" + gameName;
        loaderUrl = buildUrl + ".loader.js?v=" + gameVersion;
        config.dataUrl = buildUrl + ".data.unityweb?v=" + gameVersion;
        config.frameworkUrl = buildUrl + ".framework.js.unityweb?v=" + gameVersion;
        config.codeUrl = buildUrl + ".wasm.unityweb?v=" + gameVersion;
        config.streamingAssetsUrl = base + gameName + "/StreamingAssets";
      }
      // Sick of It's builds now publish to Hawkes Games (hawkesgames.com/play/sickofit, hawkesgenwebsite
      // docs/hosted-games.md), so that pointer wins; this page's own build.json is the fallback.
      var hostedPointer = (/\.hawkesgen\.ai$/.test(location.hostname) || location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "https://beta.hawkesgames.com/play/sickofit/build.json"
        : "https://hawkesgames.com/play/sickofit/build.json";
      function readPointer(url) {
        return fetch(url, { cache: "no-store" }).then(function(r) {
          return r.ok ? r.json() : null;
        }).then(function(b) {
          return b && b.base && b.version && /^https:\/\//.test(b.base) ? b : null;
        }).catch(function() { return null; });
      }
      function startGame() {
        if (!window.fetch) { loadUnityGame(); return; }
        Promise.all([readPointer("build.json"), readPointer(hostedPointer)]).then(function(list) {
          var b = list[1] || list[0];
          if (b) {
            var v = "v" + String(b.version).replace(/^v/, "");
            if (v !== gameVersion) console.log("[Game] build.json names " + v + " (page had " + gameVersion + ")");
            useBuild(b.base, v);
          } else {
            console.warn("[Game] build.json unreadable, playing " + gameVersion);
          }
        }).then(loadUnityGame, loadUnityGame);
      }

      // Start loading immediately
      startGame();

      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.name === 'NotAllowedError' && 
            event.reason.message && event.reason.message.includes('Pointer Lock')) {
          event.preventDefault();
          console.log('Pointer lock will be re-acquired on next interaction');
        }
      });
    </script>
    <script src="../js/rewind-toy.js"></script>
    <script>
      // Load toy -> one Play gesture: tear down the toy, unlock audio, dismiss #hawkes-tap, fullscreen, start the game.
      (function () {
        var guide = document.getElementById('guide'), stage = document.getElementById('guide-toy'),
            rotate = document.getElementById('rotate-prompt'),
            fs = document.getElementById('fs-button'), container = document.getElementById('unity-container');
        var touch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;
        var ready = false, started = false, toy = null;

        function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
        function enterFs() {
          var f = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
          if (!f) return Promise.resolve(false);
          try {
            var r = f.call(container);
            return Promise.resolve(r).then(function () {
              if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape').catch(function () {});
            }).then(function () { return true; }, function (e) { console.log('Fullscreen request failed:', e && e.message); return false; });
          } catch (e) { return Promise.resolve(false); }
        }
        function exitFs() {
          var x = document.exitFullscreen || document.webkitExitFullscreen;
          if (x) try { x.call(document); } catch (e) {}
        }
        var canFs = !!(container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen);
        function syncFs() {
          fs.hidden = !started || !canFs;
          fs.textContent = isFs() ? '\u2715' : '\u26F6';
          fs.setAttribute('aria-label', isFs() ? 'Exit full screen' : 'Full screen');
        }
        fs.addEventListener('click', function () { if (isFs()) exitFs(); else enterFs(); });
        document.addEventListener('fullscreenchange', syncFs);
        document.addEventListener('webkitfullscreenchange', syncFs);

        function stopToy() {
          if (!toy) return;
          try { toy.teardown(); } catch (e) {}
          toy = null;
          window.sickofitToy = null;
        }

        function closeClimbers() {
          try {
            if (window.hawkesClimbers && typeof window.hawkesClimbers.close === 'function') window.hawkesClimbers.close();
          } catch (e) {}
        }

        function hideBlockingOverlays() {
          document.body.classList.add('hawkes-playing');
          guide.hidden = true;
          guide.style.pointerEvents = 'none';
          rotate.hidden = true;
          rotate.style.pointerEvents = 'none';
          var tap = document.getElementById('hawkes-tap');
          if (tap) {
            tap.classList.add('gone');
            tap.style.pointerEvents = 'none';
            tap.setAttribute('aria-hidden', 'true');
            setTimeout(function () { if (tap.parentNode) tap.parentNode.removeChild(tap); }, 300);
          }
          var banner = document.getElementById('install-banner');
          if (banner) {
            banner.classList.remove('show');
            banner.style.pointerEvents = 'none';
          }
        }

        function unlockAudioAndDismissTap() {
          try {
            if (window.hawkesSound && typeof window.hawkesSound.tap === 'function') {
              window.hawkesSound.tap();
            }
          } catch (e) { console.log('[Guide] hawkesSound.tap failed:', e && e.message); }
          var tap = document.getElementById('hawkes-tap');
          if (tap && !tap.classList.contains('gone')) {
            tap.classList.add('gone');
            tap.style.pointerEvents = 'none';
          }
        }

        function audioAlreadyRunning() {
          try {
            if (!window.hawkesSound || !window.hawkesSound.state) return false;
            var s = JSON.parse(window.hawkesSound.state());
            return !!(s && s.audio && String(s.audio).split(',').indexOf('running') >= 0);
          } catch (e) { return false; }
        }

        function hideTapIfAudioRunning() {
          if (!audioAlreadyRunning()) return;
          try {
            if (window.hawkesSound && window.hawkesSound.tap) window.hawkesSound.tap();
          } catch (e) {}
          var tap = document.getElementById('hawkes-tap');
          if (tap) {
            tap.classList.add('gone');
            tap.style.pointerEvents = 'none';
          }
        }

        function wireHawkesTapExtras(el) {
          if (!el || el.getAttribute('data-hawkes-guide') === '1') return;
          el.setAttribute('data-hawkes-guide', '1');
          var forward = function (e) {
            if (!el || el.classList.contains('gone')) return;
            if (e && e.type === 'pointerdown' && e.pointerType === 'touch') return;
            try { if (window.hawkesSound && window.hawkesSound.tap) window.hawkesSound.tap(); } catch (err) {}
          };
          el.addEventListener('pointerdown', forward);
          hideTapIfAudioRunning();
        }
        function watchHawkesTap() {
          var el = document.getElementById('hawkes-tap');
          if (el) wireHawkesTapExtras(el);
          hideTapIfAudioRunning();
        }
        if (document.body) {
          var mo = new MutationObserver(watchHawkesTap);
          mo.observe(document.body, { childList: true, subtree: true });
        }
        watchHawkesTap();
        document.addEventListener('visibilitychange', hideTapIfAudioRunning);

        function checkOrientation() {
          if (started) {
            rotate.hidden = true;
            rotate.style.pointerEvents = 'none';
            return;
          }
          // Before Play the toy fills the portrait phone; rotate prompt waits until after Play.
          rotate.hidden = true;
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        function onPlayGesture() {
          if (!ready || started) return;
          started = true;
          // One gesture: stop the toy loop, drop the page spectator, unlock audio, clear overlays, fullscreen.
          stopToy();
          closeClimbers();
          unlockAudioAndDismissTap();
          hideBlockingOverlays();
          enterFs();
          syncFs();
          window.dispatchEvent(new Event('resize'));
          console.log('[Guide] Play: toy down, audio unlock, overlays cleared');
        }

        function mountToy() {
          if (toy || !stage || !window.SickOfItToy || !window.SickOfItToy.mount) return;
          toy = window.SickOfItToy.mount(stage, {
            progress: true,
            sprite: stage.getAttribute('data-sprite') || '../blog/lore/img/hero.webp'
          });
          if (!toy) return;
          window.sickofitToy = toy;
          toy.setProgress(0);
          toy.onPlay(onPlayGesture);
          toy.onRetry(function () {
            if (typeof window.hawkesRetryLoad === 'function') window.hawkesRetryLoad();
          });
        }
        mountToy();

        window.addEventListener('hawkes-unity-progress', function (e) {
          if (!toy) return;
          toy.setProgress(Math.round((e.detail || 0) * 100));
        });
        window.addEventListener('hawkes-unity-fail', function (e) {
          document.body.classList.add('load-failed');
          if (toy) toy.showRetry(e.detail || "The game didn't load.");
        });
        window.addEventListener('hawkes-unity-retry', function () {
          document.body.classList.remove('load-failed');
          ready = false;
          if (toy) { toy.hideRetry(); toy.setProgress(0); }
        });
        window.addEventListener('hawkes-unity-ready', function () {
          ready = true;
          if (toy) { toy.setProgress(100); toy.showPlay(); }
          hideTapIfAudioRunning();
        });

        // Lobby presence (push only): show "N climbing right now" on the toy while waiting.
        window.addEventListener('climbers:count', function (e) {
          if (toy && e.detail && e.detail.count > 0) toy.setClimbing(e.detail.count);
          else if (toy) toy.setClimbing(0);
        });
        window.addEventListener('climbers:offline', function () { if (toy) toy.setClimbing(0); });

        // The build installs its own window.hawkesPlaytest (engine 'unity') when it loads and a bot starts a run through it.
        // A bot can't press Play, so a started run means the toy must not stay over the canvas.
        // The page's own game-start scenario clicks Play itself (hawkesPageClicksPlay), so it is left alone.
        function startedByBot() {
          if (started || window.hawkesPageClicksPlay) return;
          started = true;
          stopToy();
          closeClimbers();
          hideBlockingOverlays();
          syncFs();
          window.dispatchEvent(new Event('resize'));
          console.log('[Guide] a playtest run started in the build: load toy cleared (no Play gesture)');
        }
        (function () {
          var current = window.hawkesPlaytest;
          function wrap(pt) {
            if (!pt || pt.engine !== 'unity' || typeof pt.start !== 'function' || pt.__guideWrapped) return pt;
            var inner = pt.start;
            pt.start = function () { startedByBot(); return inner.apply(this, arguments); };
            pt.__guideWrapped = true;
            return pt;
          }
          try {
            Object.defineProperty(window, 'hawkesPlaytest', {
              configurable: true, enumerable: true,
              get: function () { return current; },
              set: function (v) { current = wrap(v); }
            });
          } catch (e) { /* not configurable: leave the contract alone */ }
        })();
        window.hawkesGuide = {
          isReady: function () { return ready; },
          isStarted: function () { return started; },
          toy: function () { return toy; }
        };
      })();
    </script>
    <script>
      // Studio playtest contract (js/game-playtest.js): only load when a bot or ?playtest= is present.
      (function () {
        var on = false;
        try {
          on = !!(navigator.webdriver || /[?&]playtest=/.test(location.search) || sessionStorage.getItem('hawkes.playtest'));
        } catch (e) {
          on = !!(navigator.webdriver || /[?&]playtest=/.test(location.search));
        }
        if (!on) return;
        var s = document.createElement('script');
        s.src = '../js/game-playtest.js';
        document.body.appendChild(s);
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('../sw.js').then(function(reg) {
            console.log('Service worker registered.', reg);
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            });
          }).catch(function(err) {
            console.error('Service worker registration failed:', err);
          });
        });
      }
    </script>
    <script>
      // Install banner logic
      (function() {
        var installBanner = document.getElementById('install-banner');
        var installButton = document.getElementById('install-button');
        var dismissButton = document.getElementById('dismiss-banner');
        var deferredPrompt;
        var autoFadeTimeout;
        
        // Check if user already dismissed the banner
        var dismissed = localStorage.getItem('pwa-install-dismissed');
        
        // Detect platform
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        function showBanner() {
          installBanner.classList.add('show');
          // Auto-fade after 10 seconds
          autoFadeTimeout = setTimeout(function() {
            hideBanner(false); // false = don't save to localStorage on auto-fade
          }, 10000);
        }
        
        function hideBanner(remember) {
          clearTimeout(autoFadeTimeout);
          installBanner.classList.add('fade-out');
          setTimeout(function() {
            installBanner.classList.remove('show', 'fade-out');
          }, 500);
          if (remember) {
            localStorage.setItem('pwa-install-dismissed', 'true');
          }
        }
        
        // Listen for beforeinstallprompt event (Chrome/Edge/Android)
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          
          if (!dismissed) {
            showBanner();
          }
        });
        
        // Show banner for iOS (no beforeinstallprompt support)
        if (isIOS && !dismissed && !navigator.standalone) {
          setTimeout(function() {
            showBanner();
          }, 1500);
        }
        
        // Install button click
        installButton.addEventListener('click', function() {
          if (deferredPrompt) {
            // Native install prompt
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(choiceResult) {
              if (choiceResult.outcome === 'accepted') {
                console.log('User installed the app');
              }
              deferredPrompt = null;
              hideBanner(true);
            });
          } else {
            // For iOS or browsers without native prompt, show alert with instructions
            if (isIOS) {
              alert('To install:\n1. Tap the Share button (□ with ↑)\n2. Scroll and tap "Add to Home Screen"\n3. Tap "Add"');
            } else {
              alert('To install:\nLook for the install icon in your browser address bar, or check your browser menu for "Install" or "Add to Home screen".');
            }
            hideBanner(true);
          }
        });
        
        // Dismiss button
        dismissButton.addEventListener('click', function() {
          hideBanner(true);
        });
      })();
    </script>
