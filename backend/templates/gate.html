<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Paywall</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="text-center mb-5">
                    <h1 class="display-3 fw-bold mb-3">PAYWALL</h1>
                    <p class="lead">If you want access, pay for it.</p>
                    <p class="text-muted">(Or don't)</p>
                </div>

                <div class="text-center mb-4">
                    <div class="display-2 fw-bold text-primary">
                        ${{ "%.2f"|format(product.price_cents / 100) }} <small class="fs-5 text-muted">USD</small>
                    </div>
                </div>

                <div class="d-grid gap-3">
                    <a href="/paywall/checkout/{{ product_id }}" class="btn btn-primary btn-lg">Pay</a>
                    <a href="/paywall/redeem?product={{ product_id }}" class="btn btn-outline-secondary btn-lg">I have a code</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
