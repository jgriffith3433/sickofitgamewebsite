<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Enter Access Code</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="text-center mb-4">
                    <h1 class="h2 fw-bold mb-2">Enter Access Code</h1>
                    <p class="text-secondary">Paste the code you received by email</p>
                </div>

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <div class="card bg-secondary bg-opacity-10 border-secondary">
                    <div class="card-body p-4">
                        <form action="/paywall/redeem" method="POST">
                            <input type="hidden" name="product_id" value="{{ product_id }}">
                            <div class="mb-3">
                                <label for="code" class="form-label fw-semibold">Access Code</label>
                                <input type="text" class="form-control form-control-lg" id="code" name="code" 
                                       placeholder="SICK-XXXX-XXXX-XXXX" 
                                       autocomplete="off" autofocus required
                                       style="font-family: 'Courier New', monospace;">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Activate Access</button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="/paywall/checkout/{{ product_id }}" class="text-decoration-none">Don't have a code? Purchase access</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Hawkes credit: installed by the deploy from sickofitgame-unity (GameDeployWindow); edit it there -->
  <style>.hawkes-credit{margin:.5rem 0 0;font:12px/1.5 Arial,sans-serif;letter-spacing:.03em;text-align:center;color:rgba(255,255,255,.45)}.hawkes-credit a{display:inline-block;white-space:nowrap;color:rgba(255,255,255,.6);text-decoration:none;transition:color .2s,text-shadow .2s}.hawkes-credit a:hover,.hawkes-credit a:focus{color:#fff;text-shadow:0 0 12px rgba(74,144,226,.8)}.hawkes-credit strong{font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.85)}.hawkes-credit-sep{margin:0 .6em}.hawkes-credit-bar{margin:0;padding:1.5rem 1rem;background:#000;border-top:1px solid rgba(13,110,253,.25)}.hawkes-credit-pinned{position:fixed;left:0;right:0;bottom:0;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:2100}@media (max-width:480px){.hawkes-credit-sep{display:none}.hawkes-credit-pinned a{display:block;margin-top:2px}}</style>
  <footer class="hawkes-credit hawkes-credit-bar"><a href="https://hawkesgen.com" target="_blank" rel="noopener" data-hawkes-credit="gen">Powered by <strong>HAWKES GEN</strong></a></footer>
  <!-- /Hawkes credit -->
</body>
</html>
