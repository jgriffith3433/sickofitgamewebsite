<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Enter Access Code</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="text-center mb-4">
                    <h1 class="h2 fw-bold mb-2">Enter Access Code</h1>
                    <p class="text-secondary">Paste the code you received by email</p>
                </div>

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <div class="card bg-secondary bg-opacity-10 border-secondary">
                    <div class="card-body p-4">
                        <form action="/paywall/redeem" method="POST">
                            <input type="hidden" name="product_id" value="{{ product_id }}">
                            <div class="mb-3">
                                <label for="code" class="form-label fw-semibold">Access Code</label>
                                <input type="text" class="form-control form-control-lg" id="code" name="code" 
                                       placeholder="SICK-XXXX-XXXX-XXXX" 
                                       autocomplete="off" autofocus required
                                       style="font-family: 'Courier New', monospace;">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Activate Access</button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="/paywall/checkout/{{ product_id }}" class="text-decoration-none">Don't have a code? Purchase access</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
