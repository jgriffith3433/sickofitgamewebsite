  <main class="container py-5">

    <!-- Analytics Dashboard -->
    <section class="mb-5">
      <div class="row g-4 mb-5">
        <div class="col-md-6 col-lg-3">
          <div class="card border-secondary bg-secondary bg-opacity-10 h-100">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Umami Analytics Dashboard
    const UMAMI_API_URL = '/umami/api';
    const WEBSITE_ID = '293705f8-b467-4c6d-a55b-f142a986fdb0';
    
    // View-only user credentials for public dashboard
    const UMAMI_USER = 'public';
    const UMAMI_PASSWORD = 'cilbup';
    
    let authToken = null;

    // Login to Umami and get auth token
    async function login() {
      try {
        const response = await fetch(`${UMAMI_API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: UMAMI_USER,
            password: UMAMI_PASSWORD
          })
        });

        if (response.ok) {
          const data = await response.json();
          authToken = data.token;
          return true;
        } else {
          console.error('Failed to login to Umami:', response.status);
          return false;
        }
      } catch (error) {
        console.error('Login error:', error);
        return false;
      }
    }

    async function fetchAnalytics() {
      try {
        // Login first if we don't have a token
        if (!authToken) {
          const loggedIn = await login();
          if (!loggedIn) {
            throw new Error('Authentication failed');
          }
        }

        // Calculate date range (last 30 days)
        const endDate = new Date().getTime();
        const startDate = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).getTime();

        // Fetch website stats (unique visitors)
        const statsResponse = await fetch(
          `${UMAMI_API_URL}/websites/${WEBSITE_ID}/stats?startAt=${startDate}&endAt=${endDate}`,
          {
            headers: {
              'Authorization': `Bearer ${authToken}`
            }
          }
        );
        
        if (statsResponse.ok) {
          const stats = await statsResponse.json();
          document.getElementById('unique-visitors').textContent = 
            stats.visitors?.toLocaleString() || '0';
        } else if (statsResponse.status === 401) {
          // Token expired, try to login again
          authToken = null;
          return fetchAnalytics();
        }

        // Fetch custom events (game_start, level1_complete, player_death)
        const eventsResponse = await fetch(
          `${UMAMI_API_URL}/websites/${WEBSITE_ID}/metrics?startAt=${startDate}&endAt=${endDate}&type=event`,
          {
            headers: {
              'Authorization': `Bearer ${authToken}`
            }
          }
        );
        
        if (eventsResponse.ok) {
          const events = await eventsResponse.json();
          
          // Find game_start events
          const gameStartEvent = events.find(e => e.x === 'game_start');
          document.getElementById('total-plays').textContent = 
            gameStartEvent?.y?.toLocaleString() || '0';
          
          // Find level1_complete events
          const level1Event = events.find(e => e.x === 'level1_complete');
          document.getElementById('level1-complete').textContent = 
            level1Event?.y?.toLocaleString() || '0';
          
          // Find player_death events
          const playerDeathEvent = events.find(e => e.x === 'player_death');
          document.getElementById('total-deaths').textContent = 
            playerDeathEvent?.y?.toLocaleString() || '0';
        } else if (eventsResponse.status === 401) {
          // Token expired, try to login again
          authToken = null;
          return fetchAnalytics();
        }
      } catch (error) {
        console.error('Failed to fetch analytics:', error);
        // Show error state
        document.querySelectorAll('.display-4').forEach(el => {
          el.textContent = 'N/A';
        });
      }
    }

    // Load analytics on page load
    fetchAnalytics();
  </script>
