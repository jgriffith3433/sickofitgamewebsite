services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Use the development target so dev differs from prod (live mounts)
      target: development
    container_name: sickofitgame-dev
    ports:
      - "80:80"
    volumes:
      # Mount for live development - update files without rebuilding
      - ./Game:/usr/share/nginx/html/Game
      - ./PreGame:/usr/share/nginx/html/PreGame
      - ./blog:/usr/share/nginx/html/blog
      - ./music:/usr/share/nginx/html/music
      - ./shorts:/usr/share/nginx/html/shorts
      - ./images:/usr/share/nginx/html/images
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico
      - ./index.html:/usr/share/nginx/html/index.html
      # Optional: mount nginx.conf for live nginx edits
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - game-network
    restart: unless-stopped
    depends_on:
      - paywall
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  paywall:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paywall-dev
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_xxx}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_xxx}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_xxx}
      - SITE_URL=${SITE_URL:-http://localhost}
      - SITE_NAME=${SITE_NAME:-Sick Of It}
      - COOKIE_SECURE=false
      - COOKIE_DOMAIN=
      - SESSION_EXPIRY_DAYS=${SESSION_EXPIRY_DAYS:-365}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM:-support@sickofitgame.com}
      - DB_PATH=/data/paywall.db
      - PRODUCTS=${PRODUCTS:-}
      - PROTECTED_PATHS=${PROTECTED_PATHS:-}
      - CLEANUP_SECRET=${CLEANUP_SECRET:-dev-cleanup}
    volumes:
      - ./backend:/app
      - paywall-data-dev:/data
    networks:
      - game-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/paywall/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  paywall-data-dev:

networks:
  game-network:
    driver: bridge
