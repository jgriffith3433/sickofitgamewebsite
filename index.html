<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sick Of It</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* Prevent text size adjustment on orientation change */
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        position: fixed;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: none;
      }

      #start-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        cursor: pointer;
      }

      #start-overlay h1 {
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 48px;
        margin-bottom: 30px;
        text-shadow: 0 0 20px rgba(74, 144, 226, 0.8);
      }

      #button-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      #start-button {
        background: linear-gradient(135deg, #4a90e2, #2ecc71);
        color: white;
        border: none;
        padding: 20px 60px;
        font-size: 24px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }

      #start-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(46, 204, 113, 0.6);
      }

      #start-button:active {
        transform: translateY(0);
      }

      .secondary-button {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 15px 50px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 3px 15px rgba(255, 255, 255, 0.1);
        text-decoration: none;
        display: inline-block;
      }

      .secondary-button:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
      }

      .secondary-button:active {
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        #start-overlay h1 {
          font-size: 36px;
          margin-bottom: 20px;
        }

        #button-container {
          gap: 15px;
          width: 90%;
        }

        #start-button {
          padding: 15px 40px;
          font-size: 20px;
          width: 100%;
          max-width: 300px;
        }

        .secondary-button {
          padding: 12px 35px;
          font-size: 18px;
          width: 100%;
          max-width: 300px;
          text-align: center;
        }
      }

      body {
        overscroll-behavior-y: contain;
      }

      /* Install banner styling */
      #install-banner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(30, 30, 30, 0.98);
        padding: 12px 20px;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        font-family: Arial, sans-serif;
        gap: 15px;
        flex-wrap: wrap;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      #install-banner.show {
        display: flex;
        opacity: 1;
      }

      #install-banner.fade-out {
        opacity: 0;
      }

      #install-banner-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        margin: 0;
        flex: 1;
        min-width: 200px;
        text-align: center;
      }

      #install-banner-text strong {
        font-weight: bold;
        color: #fff;
      }

      #install-banner-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      #install-banner button {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 20px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: Arial, sans-serif;
        white-space: nowrap;
      }

      #install-banner button:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-1px);
      }

      #dismiss-banner {
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 6px 15px;
        font-size: 16px;
      }

      #dismiss-banner:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.9);
      }

      @media (max-width: 600px) {
        #install-banner {
          padding: 10px 15px;
        }
        #install-banner-text {
          font-size: 12px;
        }
        #install-banner button {
          font-size: 12px;
          padding: 6px 15px;
        }
      }

    </style>
  </head>
  <body>
    <div id="install-banner">
      <p id="install-banner-text"><strong>Install for offline play!</strong> Get faster loads and play anytime, anywhere.</p>
      <div id="install-banner-buttons">
        <button id="install-button">Install</button>
        <button id="dismiss-banner">×</button>
      </div>
    </div>
    <div id="start-overlay">
      <h1>Sick Of It</h1>
      <div id="button-container">
        <a id="start-button" href="/Game/index.html">CLICK TO START</a>
        <a href="blog/index.html" class="secondary-button">Blog</a>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Service worker registered.', reg);
            
            // Check for updates on visibility change and periodically (every 60 seconds)
            let updateCheckInterval;
            
            const checkForUpdates = () => {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            };
            
            // Check on visibility change
            document.addEventListener('visibilitychange', checkForUpdates);
            
            // Also check every 60 seconds when visible
            updateCheckInterval = setInterval(checkForUpdates, 60000);
            
            // Handle service worker updates
            reg.addEventListener('updatefound', function() {
              const newWorker = reg.installing;
              console.log('Service worker update found!');
              
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New service worker is installed, prompt user to refresh
                  console.log('New version available! Activating...');
                  newWorker.postMessage({ action: 'skipWaiting' });
                }
              });
            });
          }).catch(function(err) {
            console.error('Service worker registration failed:', err);
          });
          
          // Reload page when new service worker takes control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (refreshing) return;
            refreshing = true;
            console.log('Service worker updated, reloading page...');
            window.location.reload();
          });
        });
      }
    </script>
    <script>
      // Install banner logic
      (function() {
        var installBanner = document.getElementById('install-banner');
        var installButton = document.getElementById('install-button');
        var dismissButton = document.getElementById('dismiss-banner');
        var deferredPrompt;
        var autoFadeTimeout;
        
        // Check if user already dismissed the banner
        var dismissed = localStorage.getItem('pwa-install-dismissed');
        
        // Detect platform
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        function showBanner() {
          installBanner.classList.add('show');
          // Auto-fade after 10 seconds
          autoFadeTimeout = setTimeout(function() {
            hideBanner(false); // false = don't save to localStorage on auto-fade
          }, 10000);
        }
        
        function hideBanner(remember) {
          clearTimeout(autoFadeTimeout);
          installBanner.classList.add('fade-out');
          setTimeout(function() {
            installBanner.classList.remove('show', 'fade-out');
          }, 500);
          if (remember) {
            localStorage.setItem('pwa-install-dismissed', 'true');
          }
        }
        
        // Listen for beforeinstallprompt event (Chrome/Edge/Android)
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          
          if (!dismissed) {
            showBanner();
          }
        });
        
        // Show banner for iOS (no beforeinstallprompt support)
        if (isIOS && !dismissed && !navigator.standalone) {
          setTimeout(function() {
            showBanner();
          }, 1500);
        }
        
        // For desktop browsers, show banner even without beforeinstallprompt
        // This helps users know they can install via browser menu
        if (!isIOS && !dismissed) {
          setTimeout(function() {
            showBanner();
          }, 2000);
        }
        
        // Install button click
        installButton.addEventListener('click', function() {
          if (deferredPrompt) {
            // Native install prompt
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function(choiceResult) {
              if (choiceResult.outcome === 'accepted') {
                console.log('User installed the app');
              }
              deferredPrompt = null;
              hideBanner(true);
            });
          } else {
            // For iOS or browsers without native prompt, show alert with instructions
            if (isIOS) {
              alert('To install:\n1. Tap the Share button (□ with ↑)\n2. Scroll and tap "Add to Home Screen"\n3. Tap "Add"');
            } else {
              alert('To install:\nLook for the install icon in your browser address bar, or check your browser menu for "Install" or "Add to Home screen".');
            }
            hideBanner(true);
          }
        });
        
        // Dismiss button
        dismissButton.addEventListener('click', function() {
          hideBanner(true);
        });
      })();
    </script>
  </body>
</html>
