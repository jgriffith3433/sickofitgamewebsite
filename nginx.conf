server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS resolver for container name resolution
    resolver 127.0.0.11 valid=30s;

    # ---------------------------------------------------------------
    # Emoji Reactions API - proxy to Flask backend
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://paywall:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------
    # Paywall backend - proxy all /paywall/ routes to Flask service
    # ---------------------------------------------------------------
    location /paywall/ {
        proxy_pass http://paywall:5000/paywall/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Internal auth sub-request – Nginx calls this for protected paths
    location = /paywall/auth-check {
        internal;
        proxy_pass http://paywall:5000/paywall/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # ---------------------------------------------------------------
    # Public content: /PreGame/ – no auth required (free demo/preview)
    # Use ^~ to give this priority over regex matches
    # ---------------------------------------------------------------
    location ^~ /PreGame/ {
        # No auth_request - this is public content
        try_files $uri $uri/ =404;

        # HTML files under /PreGame/ - no cache
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Unity WebGL compression support for files under /PreGame/
        location ~ \.wasm\.gz$ {
            gzip off;
            default_type application/wasm;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.js\.gz$ {
            gzip off;
            default_type application/javascript;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.data\.gz$ {
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.wasm\.br$ {
            gzip off;
            default_type application/wasm;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.js\.br$ {
            gzip off;
            default_type application/javascript;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.data\.br$ {
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.bundle\.gz$ {
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        location ~ \.bundle\.br$ {
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        location ~ \.wasm$ {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.loader\.js$ {
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        }
        
        # All other JS files under /PreGame/
        location ~ \.js$ {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Data files under /PreGame/
        location ~ \.data$ {
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Bundle files under /PreGame/
        location ~ \.bundle$ {
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        
        # Static assets under /PreGame/ (images, CSS, fonts, etc.)
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    # ---------------------------------------------------------------
    # Protected content: /Game/ – requires paywall auth
    # Use ^~ to give this priority over regex matches
    # ---------------------------------------------------------------
    location ^~ /Game/ {
        auth_request /paywall/auth-check;
        error_page 401 = @paywall_redirect;

        # Existing Unity serving rules still apply inside this block
        try_files $uri $uri/ =404;

        # HTML files under /Game/ - no cache, requires auth
        location ~ \.html$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Unity WebGL compression support for files under /Game/
        location ~ \.wasm\.gz$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/wasm;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.js\.gz$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/javascript;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.data\.gz$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.wasm\.br$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/wasm;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.js\.br$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/javascript;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.data\.br$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.bundle\.gz$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        location ~ \.bundle\.br$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        location ~ \.wasm$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.loader\.js$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        }
        
        # All other JS files under /Game/
        location ~ \.js$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Data files under /Game/
        location ~ \.data$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Bundle files under /Game/
        location ~ \.bundle$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        
        # Static assets under /Game/ (images, CSS, fonts, etc.)
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
            auth_request /paywall/auth-check;
            error_page 401 = @paywall_redirect;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    # Named location for paywall redirect on 401
    location @paywall_redirect {
        return 302 /paywall/gate?product=default&uri=$request_uri;
    }

    # Umami Analytics - Proxy to analytics container
    # This allows the website to access Umami API and tracking script
    # Use ^~ to give this location priority over regex matches
    location ^~ /umami/ {
        proxy_pass http://umami:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml application/wasm application/octet-stream;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers for Unity WebGL (if needed for external resources)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;

    # Pre-compressed files MUST come before general patterns
    # WebAssembly with Gzip compression
    location ~ \.wasm\.gz$ {
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # JavaScript with Gzip compression
    location ~ \.js\.gz$ {
        gzip off;
        default_type application/javascript;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Data files with Gzip compression
    location ~ \.data\.gz$ {
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebAssembly with Brotli compression
    location ~ \.wasm\.br$ {
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # JavaScript with Brotli compression
    location ~ \.js\.br$ {
        gzip off;
        default_type application/javascript;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Data files with Brotli compression
    location ~ \.data\.br$ {
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unity Addressables bundle files with Gzip compression
    location ~ \.bundle\.gz$ {
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
    }

    # Unity Addressables bundle files with Brotli compression
    location ~ \.bundle\.br$ {
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
    }

    # Unity WebGL specific MIME types - uncompressed files
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unity loader.js should not be cached
    location ~ \.loader\.js$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Umami game events JS should not be cached (frequently updated)
    location = /umami-game-events.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Emoji reactions JS/CSS - no cache (frequently updated)
    location = /blog/emoji-reactions.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location = /blog/emoji-reactions.css {
        default_type text/css;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~ \.js$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.data$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unity Addressables bundle files - uncompressed
    location ~ \.bundle$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
    }

    # Cache static assets
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Audio files - music folder
    location /music/ {
        default_type audio/mpeg;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location ~* \.(mp3|wav|ogg|m4a)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
    }

    # Video files - shorts folder
    location /shorts/ {
        default_type video/mp4;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location ~* \.(mp4|webm|ogg|mov|avi|mkv)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
    }

    # Main HTML file - no cache
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # All HTML files should not be cached
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # PWA: service worker, manifest, icons, offline page
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /manifest.json =404;
    }

    location /icons/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /offline.html {
        try_files /offline.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # All other requests
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access logs for health checks
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
